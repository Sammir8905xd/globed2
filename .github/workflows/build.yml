name: Build Globed for Windows

on:
  workflow_dispatch: # Ejecución manual desde la pestaña Actions
  push:
    branches:
      - '**' # Se ejecuta al subir cambios a cualquier rama

jobs:
  build:
    name: Build Windows (.geode)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # OBLIGATORIO para Globed

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Geode CLI (via Winget)
        shell: pwsh
        run: |
          winget install GeodeSDK.GeodeCLI --accept-source-agreements --accept-package-agreements
          
          # Buscamos dónde se instaló realmente para evitar errores de PATH
          $geodePath = Join-Path $env:LOCALAPPDATA "Geode\bin"
          if (Test-Path "$geodePath\geode.exe") {
            Write-Host "Geode found at $geodePath"
            echo "$geodePath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            # Intento alternativo en archivos de programa si winget lo mandó ahí
            $altPath = "C:\Program Files\GeodeSDK\bin"
            if (Test-Path "$altPath\geode.exe") {
               echo "$altPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Setup Geode SDK
        shell: pwsh
        run: |
          # Refrescamos el PATH para esta sesión de shell específica
          $env:PATH += ";$env:LOCALAPPDATA\Geode\bin"
          geode profile add default
          geode sdk install nightly

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build with geobuild
        shell: pwsh
        run: |
          # Aseguramos el PATH de nuevo para el script de compilación
          $env:PATH += ";$env:LOCALAPPDATA\Geode\bin"
          python geobuild.py --platform win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Globed-Windows-Build
          path: "**/*.geode"
          if-no-files-found: error
