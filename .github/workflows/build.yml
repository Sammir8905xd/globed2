name: Build Globed for Windows

on:
  workflow_dispatch: # Ejecución manual desde la pestaña Actions
  push:
    branches:
      - '**' # Se ejecuta al subir cambios a cualquier rama

jobs:
  build:
    name: Build Windows (.geode)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # OBLIGATORIO para Globed

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Geode CLI (via Winget)
        shell: pwsh
        run: |
          winget install GeodeSDK.GeodeCLI --accept-source-agreements --accept-package-agreements
          
          # Forzamos la búsqueda del ejecutable en las rutas comunes de winget
          $possiblePaths = @(
            (Join-Path $env:LOCALAPPDATA "Geode\bin"),
            "C:\Program Files\GeodeSDK\bin",
            "$env:USERPROFILE\.geode\bin"
          )

          foreach ($path in $possiblePaths) {
            if (Test-Path "$path\geode.exe") {
              Write-Host "Geode found at $path"
              echo "$path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              break
            }
          }

      - name: Setup Geode SDK
        shell: pwsh
        run: |
          # Intentamos encontrar el ejecutable para invocarlo directamente si el alias falla
          $geodeExe = Get-Command geode -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $geodeExe) {
            $geodeExe = (Get-ChildItem -Path "$env:LOCALAPPDATA\Geode\bin\geode.exe", "C:\Program Files\GeodeSDK\bin\geode.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }

          if (-not $geodeExe) {
            throw "No se pudo encontrar geode.exe en el sistema."
          }

          Write-Host "Using geode executable at: $geodeExe"
          
          # Usamos la ruta absoluta para evitar el error de 'not recognized'
          & $geodeExe profile add default
          & $geodeExe sdk install nightly

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build with geobuild
        shell: pwsh
        run: |
          # Obtenemos la ruta absoluta de geode de nuevo para el proceso de build
          $geodeExe = (Get-ChildItem -Path "$env:LOCALAPPDATA\Geode\bin\geode.exe", "C:\Program Files\GeodeSDK\bin\geode.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($geodeExe) {
            $env:PATH += ";$(Split-Path $geodeExe)"
          }
          
          python geobuild.py --platform win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Globed-Windows-Build
          path: "**/*.geode"
          if-no-files-found: error
