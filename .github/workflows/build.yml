name: Build Globed for Windows

on:
  workflow_dispatch: # Ejecución manual desde la pestaña Actions
  push:
    branches:
      - '**' # Se ejecuta al subir cambios a cualquier rama

jobs:
  build:
    name: Build Windows (.geode)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # OBLIGATORIO para Globed

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Geode CLI (via Winget)
        shell: pwsh
        run: |
          winget install GeodeSDK.GeodeCLI --accept-source-agreements --accept-package-agreements
          
          $geodeDir = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Packages\GeodeSDK.GeodeCLI_Microsoft.Winget.Source_8wekyb3d8bbwe"
          if (-not (Test-Path $geodeDir)) {
            $geodeDir = Join-Path $env:LOCALAPPDATA "Geode\bin"
          }

          if (-not (Test-Path (Join-Path $geodeDir "geode.exe"))) {
            $find = Get-ChildItem -Path "$env:LOCALAPPDATA" -Filter "geode.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($find) { $geodeDir = $find.DirectoryName }
          }

          Write-Host "Geode detectado en: $geodeDir"
          echo "$geodeDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Geode SDK
        shell: pwsh
        run: |
          $geodeExe = (Get-ChildItem -Path "$env:LOCALAPPDATA\Geode\bin\geode.exe", "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\*\geode.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $geodeExe) { $geodeExe = "geode" }

          & $geodeExe config setup
          # Eliminamos errores de interacción con perfiles
          & $geodeExe profile add --name default .
          & $geodeExe sdk install nightly
          & $geodeExe sdk install-binaries
          
          # Exportamos la variable de entorno necesaria para CMake/geobuild
          $sdkPath = & $geodeExe sdk path
          echo "GEODE_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build with geobuild
        shell: pwsh
        run: |
          # Localizamos geode para el PATH
          $geodeExe = (Get-ChildItem -Path "$env:LOCALAPPDATA" -Filter "geode.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($geodeExe) {
            $env:PATH += ";$(Split-Path $geodeExe)"
          }

          # FIX para NameError: name 'Build' is not defined
          $content = Get-Content geobuild.py
          if (-not ($content -match "from __future__ import annotations")) {
            $newContent = @("from __future__ import annotations") + $content
            Set-Content geobuild.py $newContent
          }

          # Ejecutamos el build con la variable de entorno ya cargada
          python geobuild.py --platform win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Globed-Windows-Build
          path: "**/*.geode"
          if-no-files-found: error
