name: Build Globed for Windows

on:
  workflow_dispatch: # Ejecución manual desde la pestaña Actions
  push:
    branches:
      - '**' # Se ejecuta al subir cambios a cualquier rama

jobs:
  build:
    name: Build Windows (.geode)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # OBLIGATORIO para Globed

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Geode CLI (via Cargo)
        # Usamos Cargo ya que el runner de windows-latest ya tiene Rust
        run: |
          cargo install geode-cli
          # Cargo instala en ~/.cargo/bin, que ya suele estar en el PATH de GitHub
          # pero por si acaso forzamos la actualización del PATH
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Geode SDK
        run: |
          geode profile add default
          geode sdk install nightly

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build with geobuild
        # Script específico de Globed
        run: |
          python geobuild.py --platform win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Globed-Windows-Build
          path: "**/*.geode"
          if-no-files-found: error
